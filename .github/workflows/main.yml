name: Build Android App

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unzip project
      run: unzip -q ./*.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build with Gradle
      working-directory: StickerKeyboard-fixed
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: StickerKeyboard-fixed/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Publish APK as a direct download
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "build-${{ github.run_number }}" \
          StickerKeyboard-fixed/app/build/outputs/apk/debug/app-debug.apk \
          --title "Build ${{ github.run_number }}" \
          --notes "Debug APK"
